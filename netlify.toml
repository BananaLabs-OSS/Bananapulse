[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # RESEND_FROM_NAME and RESEND_FROM_EMAIL are sender identifiers, not secrets.
  # Netlify's secrets scanner false-positives because they're set as env vars
  # but appear in code as fallback defaults.
  SECRETS_SCAN_OMIT_KEYS = "RESEND_FROM_NAME,RESEND_FROM_EMAIL"

# User-defined Netlify functions live here, alongside the Astro adapter's own
# internal SSR function (which the adapter emits to its own path). This is where
# the scheduled sweep driver lives.
[functions]
  directory = "netlify/functions"

# Scheduled function: drives the autonomous dead-man / TTL sweep.
# netlify/functions/sweep-cron.mjs declares `config.schedule = "* * * * *"`
# (every minute) and POSTs to /api/v1/sweep with UPTIME_HOOK_SECRET, so the
# quorum engine re-evaluates every component on a timer with no human in the
# loop. The cadence is owned by the function's exported config; this block only
# ensures the function directory is discovered.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "application/atom+xml; charset=utf-8"
