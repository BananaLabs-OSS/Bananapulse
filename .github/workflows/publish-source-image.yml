name: Publish source image

on:
  push:
    tags:
      - 'source-v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: bananapulse-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build:local

      - name: Build reproducible source package
        run: |
          git archive --format=tar.gz --prefix=bananapulse/ --output=bananapulse-source.tar.gz HEAD
          sha256sum bananapulse-source.tar.gz > bananapulse-source.tar.gz.sha256
          digest="$(cut -d ' ' -f 1 bananapulse-source.tar.gz.sha256)"
          jq -n \
            --arg version "$GITHUB_REF_NAME" \
            --arg revision "$GITHUB_SHA" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/bananapulse-source.tar.gz" \
            --arg sha256 "$digest" \
            '{schemaVersion:1, version:$version, revision:$revision, url:$url, sha256:$sha256}' \
            > bananapulse.lock.json

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish immutable source image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.source
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/bananalabs-oss/bananapulse-source:sha-${{ github.sha }}
            ghcr.io/bananalabs-oss/bananapulse-source:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/BananaLabs-OSS/Bananapulse
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish checksum-pinned source package
        if: startsWith(github.ref, 'refs/tags/source-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Bananapulse source $GITHUB_REF_NAME" \
            --notes "Verified source artifact for downstream composition. Deployments must pin the accompanying SHA-256 checksum." \
            bananapulse-source.tar.gz \
            bananapulse-source.tar.gz.sha256 \
            bananapulse.lock.json
