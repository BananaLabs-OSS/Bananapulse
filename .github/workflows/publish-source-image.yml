name: Publish source image

on:
  push:
    tags:
      - 'source-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bananapulse-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build:local

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish immutable source image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile.source
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/bananalabs-oss/bananapulse-source:sha-${{ github.sha }}
            ghcr.io/bananalabs-oss/bananapulse-source:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/BananaLabs-OSS/Bananapulse
            org.opencontainers.image.revision=${{ github.sha }}
