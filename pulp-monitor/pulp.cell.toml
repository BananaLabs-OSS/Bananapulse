# Generic, restart-safe monitoring state owner.  It has no HTTP, email,
# subscriber, or admin-auth capability: callers own those edge concerns.
name = "pulp-monitor"
version = "1.1.0"
wasm = "pulp-monitor.wasm"
wasm_sha256 = "1c9cd01bb56738bc927365c72e7ea766fbbe144b9a5d0e7c4c6c87f207678cfc"
# Leave room for retained history while replaying large durable logs.
max_memory_pages = 8192
call_timeout_ms = 120000
provides = [
  "monitor.v1.catalog",
  "monitor.v1.command",
  "monitor.v1.query",
  "monitor.v1.projection",
]
consumes = []
capabilities = ["storage.sqlite"]

[execution]
mode = "fusible"
group = "bananapulse-sqlite-core"
abi = "pulp-linear-v1"

[config]
storage_namespace = "bananapulse/monitor/v1"
